[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "oppencouncil"
version = "0.2.1"
description = "One local review site for project-owned scientific definition discussions"
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
dependencies = []

[project.scripts]
oppencouncil = "oppencouncil.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["oppencouncil"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
